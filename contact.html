<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

</head>
<body>
  <header>
    <h1>Contact Us</h1>
    <p>Have questions or suggestions? Reach out to us!</p>
  </header>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="diseases.html">Diseases</a></li>

      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <section class="main4">
    <h2>Get in Touch</h2>
    <form class="contact-form" action="#" method="post">
      <label for="name">Full Name:</label>
      <input style="width: 477px;" type="text" id="name" name="name" required minlength="3" maxlength="40" pattern="[A-Za-z\s]+" placeholder="Enter your name">

      <label for="email">Email Address:</label>
      <input style="width: 477px;" type="email" id="email" name="email" required placeholder="example@gmail.com">

      <label for="phone">Phone Number:</label>
      <input style="width: 477px;" type="tel" id="phone" name="phone" required pattern="[0-9]{10}" placeholder="10-digit mobile number">

      <label for="message">Your Message:</label>
      <textarea style="width: 477px;" id="message" name="message" required minlength="10" maxlength="500" placeholder="Write your message..."></textarea>

      <button type="submit" id="btn">Send Message</button>
       <button type="button" id="clearBtn">Clear Response</button>
    </form>
  </section>
  
<footer>
    <p>AgriCare | Contact with me here</p>
  <div class="social-icons">
    <a href="https://www.linkedin.com/in/pranavi-patil-087804251" target="_blank" title="LinkedIn">
      <img src="./images4/LinkedIn_logo_2.png" alt="LinkedIn" />
    </a>
    <a href="GitHub.com/pranavipatil" target="_blank" title="GitHub">
      <img src="./images4/github_logo_2.png" alt="GitHub" />
    </a>
  </div>
</footer>
        <script src="./main.js"></script>
</body>
</html>
